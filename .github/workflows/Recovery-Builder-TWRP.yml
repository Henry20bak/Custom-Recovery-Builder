# GitHub Actions workflow for Recovery Builder

name: Recovery Builder

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: | 
          sudo apt update 
          sudo apt install -y \
            libncurses-dev

      # Other steps in the workflow...
      
